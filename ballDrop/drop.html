<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="YouTube.css">
    <link rel="stylesheet" href="drop.css">
    <title>Drop DOOM!!</title>
</head>
<body>
    <div id="scores">
        <div id="lives">
            <div id="heart1" class="hearts">
                <!-- <i class="fa-regular fa-heart"></i> -->
                <i class="fa-solid fa-heart"></i>
            </div>
            <div id="heart2" class="hearts">
                <!-- <i class="fa-regular fa-heart"></i> -->
                <i class="fa-solid fa-heart"></i>
            </div>
            <div id="heart3" class="hearts">
                <!-- <i class="fa-regular fa-heart"></i> -->
                <i class="fa-solid fa-heart"></i>
            </div>
        </div>
        <div id="score">SCORE :: <p id="scorevalue">0</p></div>
        <div id="highscore">HIGH SCORE :: <p id="hscorevalue">0</p></div>
    </div>
    <div id="main">
    <div id="left"></div>
    <div id="content">
        <div id="game">
            <div id="enter"></div>
            <div id="gmain">
                <div id="box1" class="box">
                </div>
                <div id="box2" class="box">
                </div>
                <div id="box3" class="box">
                </div>
                <div id="box4" class="box">
                </div>
                <div id="box5" class="box">
                </div>
            </div>
            <div id="exit"></div>
        </div>
    </div>
    <div id="right">
        <div class="control" id="playing">
            <i class="fa-solid fa-circle-play"></i>
            <h6 id="pa">Play</h6>
        </div>
        <div class="control" id="reset">
            <i class="fa-solid fa-circle-play"></i>
            <h6 id="re">Reset</h6>
        </div>
    </div>
    </div>
    <div id="play">
        <div id="pbutton" class="control center">
            <i class="fa-solid fa-circle-play"></i>
        <h6>Enter</h6>
        </div>
        <div id="sword1"></div>
        <div id="sword2"></div>
    </div>
    <div id = "timmer">
        <div id = "glowed" class="glow"> 
            3
        </div> 
    </div>
    <div id="end_part">
        <div id="score_project">SCORE :: <p id="scorevalue_project">0</p></div>
        <p id="over_appear">Game over!!!</p>
        <button id="play_again">Play Again</button>
    </div>
    <script src="drop.js"></script> 
</body>
</html>
